[package]
name = "mvchat"
version = "0.1.0"
edition = "2024"
publish = false
description = "Proximity voice chat for Magnetite: wasm mod, voice relayed through the game server as encrypted mvchat:voice payloads"

# The SDK build this mod is made for: `cargo horizon-mod update` moves it.
[package.metadata.horizon]
sdk = "2cd42f3a3d4d1e6e0040991c098386a76755479e"

[lib]
name = "mvchat"
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Registry dependencies, pinned to the exact versions of the game's own Cargo.lock
# (crates/horizon-mod-deps / Cargo.lock of the game). All pure Rust, so they build to
# mod.wasm too. Pin them in this mod's Cargo.lock with `horizon-launcher native-lock .`
# for native builds; the wasm build resolves them itself.
sha2 = "=0.10.9"
chacha20poly1305 = "=0.10.1"
rusty-opus = { version = "=1.0.2", optional = true }

# cpal needs a native host audio API, so it is never in the wasm dependency graph.
# It stays for the future native build (feature pc-audio, off by default).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "=0.16.0", optional = true }

[features]
# The wasm build (`cargo horizon-mod build --wasm`) uses the default features, so the
# default set must be wasm-safe: no cpal, no sockets, no threads. `opus` is pure Rust
# and codes the relayed voice once the platform's microphone hook lands.
default = ["opus"]
opus = ["dep:rusty-opus"]
# Native PC build only: real capture/playback through cpal (never on wasm).
pc-audio = ["opus", "dep:cpal"]

# A mod is its own project, not a member of the game's workspace. The fetched SDK under
# .horizon/ belongs to the game's workspace, not this one.
[workspace]
exclude = [".horizon"]
